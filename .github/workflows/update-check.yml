name: 官方知识同步与发布
on:
  schedule:
    - cron: '17 1,13 * * *'
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: knowledge-publish
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      check_result: ${{ steps.collect.outcome }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y antiword
      - run: pip install -r requirements.txt
      - name: 验证采集和版本逻辑
        run: python -m unittest discover -s tests -v
      - name: 采集正文与附件，生成版本差异
        id: collect
        if: github.event_name != 'push'
        continue-on-error: true
        env:
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python scripts/upd_status.py
      - name: 构建并校验站点
        run: |
          python scripts/build.py
          python scripts/validate.py
          node --check assets/app.js
          node --check assets/hub.js
      - name: 保存知识、历史和检查记录
        if: github.event_name != 'push'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data assets/data.js update_status.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore: 同步官方正文、版本差异与检查日志'
            git push origin HEAD:main
          fi
      - name: 准备发布内容
        run: |
          mkdir _site
          cp index.html update_status.json _site/
          cp -R assets data _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: sync
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
      - name: 标记不完整检查
        if: needs.sync.outputs.check_result == 'failure'
        run: |
          echo '部分官方来源未能完整检查；已发布真实错误状态并保留有效内容，请查阅更新日志。'
          exit 1
