<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>企业会计准则知识库</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css" crossorigin="anonymous">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js" crossorigin="anonymous"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js" crossorigin="anonymous"></script>
<style>
:root{
  --bg:#f5f6f8; --panel:#fff; --ink:#1a1d21; --sub:#5c6570; --line:#e4e7eb;
  --brand:#1554a8; --brand-soft:#eaf1fb; --brand-ink:#0f4a93;
  --chip:#f0f3f7; --chipink:#3d4854;
  --hover:#f1f3f6; --chd:#fbfcfd; --mark:#fff0a8;
  --scroll:#cfd6dd; --scrollh:#b7c0c9;
  --fs:14px; --kb-font:-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
}
/* ---- 主题 ---- */
html[data-theme="sepia"]{
  --bg:#f6efe2; --panel:#fbf6ec; --ink:#3f3527; --sub:#7a6c56; --line:#e6dcc8;
  --brand:#9c6614; --brand-soft:#f3e6cd; --brand-ink:#7a4f0d;
  --chip:#f0e7d5; --chipink:#5a4c36; --hover:#efe6d3; --chd:#f8f1e3;
  --mark:#ffe08a; --scroll:#d9cbb0; --scrollh:#c6b493;
}
html[data-theme="green"]{
  --bg:#e8f1e6; --panel:#f3f8f0; --ink:#20301f; --sub:#5c6f58; --line:#d6e3d0;
  --brand:#2e7d32; --brand-soft:#e0efe0; --brand-ink:#245e28;
  --chip:#e3ede0; --chipink:#3d4f3a; --hover:#e2eee0; --chd:#eef6ec;
  --mark:#ffe58a; --scroll:#c4d6bd; --scrollh:#a9c19f;
}
html[data-theme="dark"]{
  --bg:#15181d; --panel:#1c2027; --ink:#dfe3e8; --sub:#98a2ad; --line:#2c333c;
  --brand:#5aa2f0; --brand-soft:#1e2b3d; --brand-ink:#8cc0f7;
  --chip:#252c35; --chipink:#c3ccd6; --hover:#242b34; --chd:#20262e;
  --mark:#5e5320; --scroll:#39414b; --scrollh:#4a545f;
}
html[data-theme="blue"]{
  --bg:#e9f0fb; --panel:#f5f9ff; --ink:#16233a; --sub:#5b6b85; --line:#d5e0f0;
  --brand:#1c5bb8; --brand-soft:#dee9fb; --brand-ink:#164a99;
  --chip:#e2eaf7; --chipink:#3a4a63; --hover:#e4ecf9; --chd:#eef4fd;
  --mark:#ffe58a; --scroll:#c3d2e8; --scrollh:#a8bcd9;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font:var(--fs)/1.75 var(--kb-font);color:var(--ink);background:var(--bg)}
body{transition:background .2s,color .2s}
a{color:var(--brand);text-decoration:none;cursor:pointer}
a:hover{text-decoration:underline}
#app{display:flex;height:100vh;overflow:hidden}

/* 侧栏 */
#side{width:344px;min-width:344px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column}
#brand{padding:14px 18px 10px;border-bottom:1px solid var(--line)}
#brand h1{font-size:16px;margin:0;letter-spacing:.3px}
#brand .sub{font-size:12px;color:var(--sub);margin-top:3px}
#brand .row{display:flex;align-items:center;gap:6px;margin-top:9px}
#brand .row .lab{font-size:11.5px;color:var(--sub);margin-right:2px}
.thbtn{font-size:11.5px;padding:3px 9px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink);cursor:pointer}
.thbtn:hover{background:var(--hover)}
.thbtn.on{border-color:var(--brand);color:var(--brand);font-weight:600}
#modes{display:flex;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
.mode{flex:1;text-align:center;padding:7px 4px;border-radius:8px;font-size:13px;cursor:pointer;color:var(--sub)}
.mode:hover{background:var(--hover)}
.mode.on{background:var(--brand);color:#fff;font-weight:600}
#nav{flex:1;overflow:auto;padding:6px 8px 48px}

.tn>.hd,.ch>.hd,.scls>.hd{display:flex;align-items:center;gap:7px;border-radius:7px;cursor:pointer}
.tn>.hd{padding:7px 9px;font-size:13px;font-weight:600;color:var(--ink)}
.ch>.hd{padding:5px 9px;font-size:12.5px;color:var(--sub)}
.scls>.hd{padding:7px 9px;font-size:13px;font-weight:600;color:var(--ink)}
.tn>.hd:hover,.ch>.hd:hover,.scls>.hd:hover{background:var(--hover)}
.tn .car,.ch .car,.scls .car{width:11px;font-size:10px;color:var(--sub);transition:transform .15s;flex-shrink:0}
.tn.col>.car, .ch.col>.car, .scls.col>.car{transform:rotate(-90deg)}
.tn.col>.kid{display:none}
.ch.col>.aki{display:none}
.scls.col>.skid{display:none}
.kid{margin-left:11px;border-left:1px solid var(--line);padding-left:5px}
.dcount{margin-left:auto;font-size:10.5px;color:var(--sub);background:var(--chip);padding:0 6px;border-radius:9px;flex-shrink:0}
.aki{display:flex;flex-wrap:wrap;gap:3px;padding:3px 8px 6px 20px}
.aki a{font-size:12px;color:#4a5561;background:#f4f6f9;border-radius:5px;padding:2px 7px;white-space:nowrap}
.aki a:hover{background:var(--brand);color:#fff;text-decoration:none}
.aki a.act{background:var(--brand);color:#fff}
.aki a.wide{white-space:normal;line-height:1.5;text-align:left}
.skid{margin-left:11px;border-left:1px solid var(--line);padding-left:5px}
.skid a{display:flex;align-items:center;gap:6px;padding:4px 8px;border-radius:6px;font-size:12.5px;color:#3c4650}
.skid a:hover{background:var(--brand-soft);text-decoration:none}
.skid a.act{background:var(--brand);color:#fff}
.skid a.act span{color:#fff !important}
.skid .code{font-size:10.5px;color:#98a1ac;font-family:ui-monospace,Menlo,monospace;min-width:60px}

/* 主区 */
#main{flex:1;display:flex;flex-direction:column;overflow:hidden}
#top{padding:11px 20px;background:var(--panel);border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center}
#searchwrap{flex:1;position:relative;display:flex;align-items:center;min-width:0}
#searchwrap .sic{position:absolute;left:12px;color:var(--sub);pointer-events:none}
#q{flex:1;width:100%;padding:9px 34px 9px 34px;border:1px solid var(--line);border-radius:8px;font-size:13.5px;outline:none;background:var(--panel);color:var(--ink)}
#q:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
#qclr{position:absolute;right:9px;width:20px;height:20px;border:0;background:var(--chip);color:var(--sub);border-radius:50%;cursor:pointer;display:none;align-items:center;justify-content:center;padding:0}
#qclr.on{display:flex}
#qclr:hover{background:var(--line);color:var(--ink)}
/* 即时联想下拉 */
#sugbox{position:absolute;top:calc(100% + 5px);left:0;right:0;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.13);max-height:58vh;overflow:auto;display:none;z-index:60}
#sugbox.on{display:block}
#sugbox .sg-h{padding:7px 12px 5px;font-size:11px;color:var(--sub);letter-spacing:.4px;border-top:1px solid var(--line)}
#sugbox .sg-h:first-child{border-top:0}
#sugbox .sg-i{padding:8px 12px;cursor:pointer;display:flex;gap:9px;align-items:baseline;font-size:13px;line-height:1.5}
#sugbox .sg-i:hover,#sugbox .sg-i.cur{background:var(--brand-soft)}
#sugbox .sg-i .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink)}
#sugbox .sg-i .t .kw{color:var(--brand);font-weight:700;background:var(--mark);border-radius:2px;padding:0 1px}
#sugbox .sg-i .m{font-size:11px;color:var(--sub);white-space:nowrap;flex-shrink:0}
#sugbox .sg-i .m .tagk{background:var(--chip);border-radius:4px;padding:1px 5px;margin-left:5px}
#sugbox .sg-i.sg-subj .t{font-weight:700;color:var(--brand-ink)}
#sugbox .sg-i.sg-subj .m .tagk{background:var(--brand-soft);color:var(--brand-ink)}
/* 搜索结果中的科目命中卡 */
.sjhit{display:flex;align-items:center;gap:10px;background:var(--brand-soft);border:1px solid var(--brand);
  border-radius:10px;padding:11px 14px;margin:0 0 8px;cursor:pointer;flex-wrap:wrap}
.sjhit:hover{box-shadow:0 2px 10px rgba(0,0,0,.08)}
.sjhit .nm{font-weight:700;font-size:15px;color:var(--brand-ink)}
.sjhit .nm .kw{color:var(--brand);background:var(--mark);border-radius:2px;padding:0 1px}
.sjhit .cd{font-size:12px;color:var(--sub);background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:1px 7px}
.sjhit .cl{font-size:12px;color:var(--sub)}
.sjhit .ct{margin-left:auto;font-size:12.5px;color:var(--brand);white-space:nowrap}
.btn{padding:8px 13px;border:1px solid var(--line);background:var(--panel);border-radius:8px;cursor:pointer;font-size:13px;color:var(--ink);white-space:nowrap}
.btn:hover{background:var(--hover)}
.btn.upbtn{display:inline-flex;align-items:center;gap:6px}
/* 面包屑 + 返回 */
#crumb{background:var(--panel);border-bottom:1px solid var(--line);display:none}
#crumb.on{display:block}
#crumb .inner{max-width:1180px;margin:0 auto;padding:0 20px;height:38px;display:flex;align-items:center;gap:10px;min-width:0}
#backBtn{display:inline-flex;align-items:center;gap:5px;padding:5px 11px 5px 8px;border:1px solid var(--line);background:var(--panel);border-radius:7px;cursor:pointer;font-size:12.5px;color:var(--ink);flex-shrink:0}
#backBtn:hover{background:var(--brand-soft);border-color:var(--brand);color:var(--brand-ink)}
#crumbpath{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12.5px;color:var(--sub)}
#crumbpath i{font-style:normal;color:var(--line);margin:0 6px}
#crumbpath b{color:var(--ink);font-weight:600}
#crumbpath a{cursor:pointer;color:var(--brand)}
#crumbpath a:hover{text-decoration:underline}

/* 吸顶元数据条 */
#metabar{background:var(--panel);border-bottom:1px solid var(--line);display:none}
#metabar.on{display:block}
#metabar .inner{max-width:860px;margin:0 auto;padding:8px 24px;display:flex;align-items:center;gap:14px;font-size:12px;color:var(--sub);flex-wrap:wrap}
#metabar .dt{font-weight:700;color:var(--ink);font-size:12.5px;max-width:340px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#metabar .mi b{color:var(--ink)}
#metabar .bar{flex:1;height:3px;background:var(--line);border-radius:2px;min-width:60px;overflow:hidden}
#metabar .bar i{display:block;height:100%;width:0;background:var(--brand);border-radius:2px;transition:width .1s}
#metabar .mi.src{margin-left:0}
#metabar a.src{color:var(--brand)}

#content{flex:1;overflow:auto;padding:0 24px 90px;scroll-behavior:auto}

.doc-head{max-width:860px;margin:14px auto 0;padding-bottom:14px;border-bottom:2px solid var(--line)}
.doc-head .h{font-size:20px;font-weight:700;line-height:1.4}
.doc-head .m{font-size:12.5px;color:var(--sub);margin-top:8px;display:flex;gap:16px;flex-wrap:wrap;align-items:center}
.doc-head .m b{color:var(--ink)}
.doc-head .m a.src{color:var(--brand)}

/* 大标题（章 / 节） */
.sec-h{max-width:860px;margin:34px auto 6px;padding:8px 0 8px 12px;border-left:4px solid var(--brand);
  font-size:17px;font-weight:700;color:var(--brand-ink);scroll-margin-top:64px}
.sec-h .cnt{font-size:12px;font-weight:400;color:var(--sub);margin-left:8px}

.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;max-width:860px;margin:12px auto;overflow:hidden;scroll-margin-top:64px}
.card.act{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.card .chd{padding:10px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--chd)}
.card .chd .no{font-weight:700;color:var(--brand);font-size:14px}
.card .chd .ttl{font-size:13px;color:var(--sub)}
.card .chd .k{margin-left:auto;font-size:11px;color:var(--sub);background:var(--chip);padding:2px 8px;border-radius:9px}
/* 右上角来源标签：做成超链接（跳财政部官方原文） */
a.k{cursor:pointer;transition:background .12s,color .12s}
a.k:hover{background:var(--brand);color:#fff;text-decoration:none}
a.k::after{content:" ↗";font-size:10px;opacity:.75}
.card .bd{padding:14px 20px 16px}
.txt{white-space:pre-wrap;font-size:14.5px;line-height:2;color:var(--ink)}
/* 正文内的准则引用内链 */
.txt a.ref{color:var(--brand);border-bottom:1px dashed var(--brand);cursor:pointer;padding:0 1px}
.txt a.ref:hover{background:var(--brand-soft);text-decoration:none}
.qbox{background:var(--brand-soft);border-left:3px solid var(--brand);border-radius:0 8px 8px 0;padding:10px 14px;margin-bottom:12px;font-weight:600;font-size:14px}
.qbox .qcap{font-size:11px;font-weight:700;color:var(--brand);letter-spacing:1px;margin-bottom:4px;opacity:.85}
.rel{margin-top:16px;padding-top:12px;border-top:1px dashed var(--line);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.rel .lb{font-size:12px;color:var(--sub);margin-right:2px}
.rel a{font-size:12px;background:var(--chip);color:var(--chipink);border-radius:5px;padding:2px 9px}
.rel a:hover{background:var(--brand);color:#fff;text-decoration:none}
/* 涉及准则：站内跳转 */
.rel.stdrow{border-top:1px solid var(--line)}
.rel a.stdref{background:var(--brand-soft);color:var(--brand-ink);font-weight:600}
.rel a.stdref:hover{background:var(--brand);color:#fff}
.rel a.stdref::before{content:"§ ";opacity:.6}
.src{font-size:12px;color:var(--sub)}
.empty{color:var(--sub);text-align:center;padding:70px 20px;max-width:620px;margin:0 auto}
.stat{font-size:12px;color:var(--sub);max-width:860px;margin:10px auto 0;display:flex;align-items:center;gap:10px}
.stat .sorts{margin-left:auto;background:var(--chip);color:var(--chipink);border-radius:5px;padding:2px 8px;font-size:11.5px}
/* 搜索命中高亮 */
.kw{background:var(--mark);color:inherit;font-weight:700;border-radius:2px;padding:0 1px}
/* ---- 更新检查面板 ---- */
.upd-hero{border-radius:10px;padding:14px 16px;background:var(--brand-soft);border:1px solid var(--line);margin-bottom:14px}
.upd-hero.warn{background:#fff4e5;border-color:#f0c78a}
html[data-theme="dark"] .upd-hero.warn{background:#3a2c18;border-color:#6b5124}
.upd-hero .uh-t{font-size:15px;font-weight:700;color:var(--ink);margin-bottom:3px}
.upd-hero .uh-s{font-size:12.5px;color:var(--sub)}
/* 抓取异常提示 */
.upd-alert{display:flex;gap:8px;align-items:flex-start;background:var(--chip);border:1px solid var(--line);
  border-radius:8px;padding:9px 11px;margin-bottom:14px;font-size:12.5px;line-height:1.6;color:var(--sub)}
.upd-alert svg{flex-shrink:0;margin-top:2px;color:#c9772b}
.upd-sec{margin-bottom:16px}
.us-h{font-size:12.5px;font-weight:700;color:var(--ink);margin-bottom:8px;padding-left:9px;border-left:3px solid var(--brand)}
.us-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:9px}
.us-grid > div{background:var(--chip);border-radius:8px;padding:9px 6px;text-align:center}
.us-grid b{display:block;font-size:16px;color:var(--brand);line-height:1.3}
.us-grid span{font-size:11px;color:var(--sub)}
.us-note{font-size:12px;color:var(--sub);text-align:center;line-height:1.7}
.us-empty{font-size:12.5px;color:var(--sub);padding:7px 2px}
.us-list{display:flex;flex-direction:column;gap:5px}
.us-list a,.us-list span{font-size:12.5px;line-height:1.5;padding:7px 10px;border-radius:7px;background:var(--chip);
  color:var(--ink);text-decoration:none;display:flex;align-items:baseline;gap:8px}
.us-list a:hover{background:var(--brand-soft);color:var(--brand-ink)}
.us-list .ext{margin-left:auto;font-size:11px;color:var(--brand);white-space:nowrap;flex-shrink:0}
.upd-actions{display:flex;flex-wrap:wrap;gap:7px;margin-top:11px}
.upd-btn{font-size:12.5px;padding:7px 12px;border-radius:7px;border:1px solid var(--line);background:var(--panel);
  color:var(--ink);cursor:pointer;text-decoration:none;white-space:nowrap}
.upd-btn:hover{background:var(--hover)}
.upd-btn.primary{background:var(--brand);color:#fff;border-color:var(--brand)}
.upd-btn.primary:hover{background:var(--brand-ink)}

/* 回到顶部 */
#toTop{position:fixed;right:26px;bottom:26px;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);
  background:var(--panel);color:var(--brand);font-size:18px;cursor:pointer;display:none;align-items:center;justify-content:center;
  box-shadow:0 4px 14px rgba(0,0,0,.12);z-index:60}
#toTop.on{display:flex}
#toTop:hover{background:var(--brand);color:#fff}

#subjview{max-width:860px;margin:8px auto}
#subjview .sh{font-size:19px;font-weight:700}
#subjview .sc{font-size:12.5px;color:var(--sub);margin-top:6px}
#subjview .sg{font-size:13px;font-weight:700;color:var(--brand-ink);margin:22px 0 8px;border-bottom:1px solid var(--line);padding-bottom:5px}
#subjview .sitem{display:flex;gap:10px;padding:7px 0;font-size:13.5px;align-items:baseline;border-bottom:1px dotted var(--line)}
#subjview .sitem .g{color:var(--sub);font-size:12px;min-width:210px;flex-shrink:0}
.subj-hint{font-size:12px;color:var(--sub);background:var(--brand-soft);border-radius:8px;padding:10px 12px;margin:12px 0 18px;line-height:1.9}
.subj-hint a{display:inline-block;font-size:12px;background:var(--chip);color:var(--brand-ink);border-radius:5px;padding:1px 9px;margin:2px 4px 2px 0}
.subj-hint a:hover{background:var(--brand);color:#fff;text-decoration:none}
mark{background:var(--mark);padding:0 1px;border-radius:2px}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--scroll);border-radius:6px}
::-webkit-scrollbar-thumb:hover{background:var(--scrollh)}

/* ============ 响应式布局 ============ */
/* 移动端开关按钮、遮罩：桌面默认隐藏 */
#menuBtn{display:none}
#scrim{display:none}

/* 平板：侧栏收窄 */
@media (max-width:1200px) and (min-width:901px){
  #side{width:290px;min-width:290px}
  #metabar .dt{max-width:200px}
  #content{padding:0 16px 90px}
}

/* 手机/窄屏：侧栏改为抽屉浮层 */
@media (max-width:900px){
  #app{display:block;height:100vh}
  #side{
    position:fixed;top:0;left:0;bottom:0;z-index:60;
    width:86vw;max-width:340px;min-width:0;
    transform:translateX(-102%);transition:transform .22s ease;
    box-shadow:2px 0 16px rgba(0,0,0,.16);
    padding-bottom:env(safe-area-inset-bottom);
  }
  #side.open{transform:translateX(0)}
  #scrim{
    display:block;position:fixed;inset:0;z-index:55;
    background:rgba(15,23,42,.42);opacity:0;pointer-events:none;transition:opacity .2s;
  }
  #scrim.on{opacity:1;pointer-events:auto}

  #main{height:100vh;width:100%}
  #menuBtn{
    display:inline-flex;align-items:center;justify-content:center;
    flex-shrink:0;width:44px;height:44px;font-size:19px;line-height:1;
    border:1px solid var(--line);border-radius:9px;background:var(--panel);
    color:var(--ink);cursor:pointer;
  }
  #menuBtn:active{background:var(--hover)}
  /* 返回按钮触摸区 ≥44px */
  #backBtn{min-height:36px;padding:8px 13px 8px 10px;font-size:13px}

  /* 顶栏：两行布局，搜索框独占一行 */
  #top{flex-wrap:wrap;gap:7px;padding:9px 12px}
  #searchwrap{flex:1 1 100%;order:3;min-width:0}
  #q{font-size:16px} /* 16px 防 iOS 自动缩放 */
  #sugbox .sg-i{padding:10px 12px;font-size:14px}
  #checkupd{padding:8px 11px;font-size:12.5px;min-height:40px}
  /* 更新面板：单列统计，按钮加大 */
  .us-grid{grid-template-columns:repeat(2,1fr)}
  .upd-btn{padding:10px 13px;font-size:13px;min-height:42px}
  .upd-actions{flex-direction:column}
  .upd-btn{width:100%;text-align:center}

/* ===== 访问密码门 ===== */
#gate{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,var(--bg),var(--brand-soft));padding:20px}
#gate .gcard{background:var(--panel);border:1px solid var(--line);border-radius:16px;
  box-shadow:0 20px 60px rgba(15,23,42,.25);max-width:360px;width:100%;padding:30px 26px;text-align:center}
#gate .lock{font-size:30px;margin-bottom:6px}
#gate h2{font-size:18px;margin:0 0 6px;color:var(--ink)}
#gate .gh{color:var(--sub);font-size:13px;margin:0 0 18px;line-height:1.6}
#gate input{width:100%;box-sizing:border-box;padding:12px 14px;border:1px solid var(--line);
  border-radius:10px;font-size:15px;background:var(--bg);color:var(--ink);outline:none}
#gate input:focus{border-color:var(--brand)}
#gate .gbtn{margin-top:14px;width:100%;padding:12px;border:0;border-radius:10px;
  background:var(--brand);color:#fff;font-size:15px;font-weight:600;cursor:pointer}
#gate .gbtn:active{transform:translateY(1px)}
#gate .gerr{color:#e11d48;font-size:12.5px;min-height:16px;margin-top:10px}
/* ===== 密码门：忘记 / 修改密码 ===== */
#gate .glink{display:block;margin-top:14px;font-size:12.5px;color:var(--brand);cursor:pointer;text-decoration:underline}
#pwmodal .pwcard{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:0 20px 60px rgba(15,23,42,.3);max-width:380px;width:100%;padding:24px 24px 20px;text-align:left}
#pwmodal h3{margin:0 0 4px;font-size:17px;color:var(--ink)}
#pwmodal .sub{margin:0 0 14px;font-size:12.5px;color:var(--sub);line-height:1.6}
#pwmodal label{display:block;font-size:12.5px;color:var(--sub);margin:10px 0 4px}
#pwmodal input{width:100%;box-sizing:border-box;padding:10px 12px;border:1px solid var(--line);border-radius:9px;font-size:14px;background:var(--bg);color:var(--ink);outline:none}
#pwmodal input:focus{border-color:var(--brand)}
#pwmodal .perr{color:#e11d48;font-size:12px;min-height:15px;margin-top:4px}
#pwmodal .pwrow{display:flex;gap:10px;margin-top:16px}
#pwmodal .pwc{flex:1;padding:10px;border:1px solid var(--line);border-radius:9px;background:var(--panel);color:var(--ink);font-size:14px;cursor:pointer}
#pwmodal .pwb{flex:1;padding:10px;border:0;border-radius:9px;background:var(--brand);color:#fff;font-size:14px;font-weight:600;cursor:pointer}
#pwmodal .pwb:active{transform:translateY(1px)}
/* ===== 浏览统计 ===== */
.statchip{display:inline-flex;align-items:center;gap:4px;padding:6px 11px;border:1px solid var(--line);border-radius:20px;background:var(--panel);color:var(--sub);font-size:12.5px;white-space:nowrap}
.statchip b{color:var(--ink)}
.statchip.newip{color:#0a7d3b;border-color:#9bd9b3;background:#eafaf0}
.icbtn{padding:8px 11px;font-size:13px;min-height:40px;font-weight:700}
/* ===== 阅读设置面板 ===== */
#setpanel{position:fixed;top:54px;right:14px;z-index:120;width:282px;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:0 16px 44px rgba(15,23,42,.22);padding:16px 16px 14px;display:none}
#setpanel h4{margin:0 0 12px;font-size:14px;color:var(--ink)}
#setpanel .row{margin-bottom:14px}
#setpanel label{display:block;font-size:12.5px;color:var(--sub);margin-bottom:6px}
#setpanel select{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink);font-size:13.5px}
#setpanel input[type=range]{width:100%}
#setpanel .szval{float:right;color:var(--brand);font-weight:700}
#setpanel .reset{margin-top:4px;width:100%;padding:9px;border:1px solid var(--line);border-radius:9px;background:var(--panel);color:var(--ink);font-size:13px;cursor:pointer}
#setpanel .note{font-size:11.5px;color:var(--sub);line-height:1.6;margin-top:6px}
/* ===== 进入提示 toast ===== */
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);z-index:200;max-width:90vw;background:rgba(20,28,40,.94);color:#fff;padding:12px 18px;border-radius:12px;font-size:13.5px;line-height:1.6;box-shadow:0 12px 36px rgba(0,0,0,.3);opacity:0;pointer-events:none;transition:opacity .35s,transform .35s;display:flex;gap:8px;align-items:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast .tlogin{font-size:16px}
.txt .katex{font-size:1.04em}
@media (max-width:560px){#setpanel{right:8px;left:8px;width:auto}}

/* 公式 / 流程图 / 表格图片样式 */
.mathimg{display:block;margin:14px auto;background:#fff;padding:6px 10px;border-radius:6px;border:1px solid var(--line)}
.mathimg.inl{display:inline-block;vertical-align:-0.22em;margin:0 3px;padding:0;border:none;background:transparent}
